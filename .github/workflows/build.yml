name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8 is what DSM 7.2 ships as /usr/bin/python3
        image: ["python:3.8-slim", "python:3.12-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: for f in build.sh tools/discover.sh package/bin/collector.sh package/ui/api.cgi scripts/*; do sh -n "$f"; done
      - name: Build .spk
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export SPK_VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: spk
          path: dist/*.spk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.spk
          generate_release_notes: true
